<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayo Belajar Mengenal Angka</title>
<!-- Import Font Lucu untuk Anak -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow-x: hidden;
    font-family: 'Fredoka', 'Comic Sans MS', cursive;
  }

  /* Latar Belakang Langit Ceria */
  body {
    background: linear-gradient(180deg, #87CEEB 0%, #B3E5FC 40%, #FFF9C4 100%);
    min-height: 100vh;
    padding: 8px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Hiasan Matahari */
  .sun {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 70px;
    height: 70px;
    background: #FFD54F;
    border-radius: 50%;
    box-shadow: 0 0 30px #FFB300, 0 0 60px #FF8F00;
    z-index: 0;
    animation: spin 20s linear infinite;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* Hiasan Awan Melayang */
  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 50px;
    opacity: 0.8;
    z-index: 0;
    animation: floatCloud 15s ease-in-out infinite alternate;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: #fff;
    border-radius: 50%;
  }
  .cloud-1 { width: 100px; height: 30px; top: 40px; left: 10%; }
  .cloud-1::before { width: 50px; height: 50px; top: -25px; left: 15px; }
  .cloud-1::after { width: 40px; height: 40px; top: -15px; left: 50px; }
  
  .cloud-2 { width: 120px; height: 35px; top: 80px; right: 15%; animation-delay: -5s; }
  .cloud-2::before { width: 60px; height: 60px; top: -30px; left: 20px; }
  .cloud-2::after { width: 50px; height: 50px; top: -20px; left: 60px; }

  @keyframes floatCloud {
    0% { transform: translateX(0); }
    100% { transform: translateX(30px); }
  }

  /* Judul Ceria */
  h1 {
    text-align: center;
    color: #FF5252;
    font-size: clamp(26px, 5vw, 46px);
    text-shadow: 3px 3px 0 #fff, 5px 5px 0 rgba(0,0,0,0.1);
    line-height: 1;
    margin-bottom: 4px;
    z-index: 1;
    letter-spacing: 1px;
  }
  h2 {
    text-align: center;
    color: #1E88E5;
    font-size: clamp(20px, 4vw, 36px);
    text-shadow: 3px 3px 0 #fff, 5px 5px 0 rgba(0,0,0,0.1);
    margin-bottom: 10px;
    z-index: 1;
  }

  /* Grid Kartu */
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 12px;
    flex: 1;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    align-content: stretch;
    z-index: 1;
  }

  .card-container {
    perspective: 1500px;
    cursor: pointer;
    min-height: 0;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); /* Efek memantul */
  }

  .card.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 0 rgba(0,0,0,0.1), 0 12px 20px rgba(0,0,0,0.15);
    border: 6px solid;
    overflow: hidden;
    padding: 8px;
    background: #fff;
  }

  .card-front {
    /* Warna border akan diatur via inline style */
  }

  .card-back {
    transform: rotateY(180deg);
    /* Motif Polkadot Ceria */
    background-color: #FFF;
    background-image: radial-gradient(circle, var(--theme-color) 15%, transparent 16%);
    background-size: 20px 20px;
    background-position: 0 0;
  }

  .number {
    font-size: clamp(70px, 12vw, 140px);
    font-weight: 700;
    line-height: 0.9;
    text-shadow: 4px 4px 0 rgba(0,0,0,0.1);
  }

  .label {
    font-size: clamp(14px, 2vw, 22px);
    font-weight: 700;
    color: #fff;
    margin-top: 8px;
    letter-spacing: 2px;
    background: var(--theme-color);
    padding: 4px 16px;
    border-radius: 20px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
  }

  /* ===== GRID HEWAN ===== */
  .animal-grid {
    display: grid;
    gap: 4px;
    width: 100%;
    flex: 1;
    align-content: center;
    justify-content: center;
    padding: 4px;
    max-height: 70%;
    background: rgba(255,255,255,0.85); /* Agar emoji kontras dengan polkadot */
    border-radius: 16px;
    border: 3px dashed var(--theme-color);
  }

  .animal-grid .emoji {
    font-size: clamp(28px, 4.5vw, 52px);
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.1));
  }

  .animal-name {
    font-size: clamp(12px, 1.6vw, 16px);
    color: #fff;
    margin-top: 6px;
    text-align: center;
    font-weight: 700;
    background: var(--theme-color);
    padding: 4px 12px;
    border-radius: 15px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.1);
  }

  /* Layout per jumlah */
  .layout-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .layout-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  .layout-3 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr; }
  .layout-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .layout-5 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .layout-6 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .layout-7 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
  .layout-8 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
  .layout-9 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }

  .zero-display {
    font-size: clamp(50px, 8vw, 90px);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
  }

  /* Warna Tema per Kartu */
  .theme-1 { --theme-color: #FF5252; --theme-light: #FFEBEE; } /* Merah */
  .theme-2 { --theme-color: #448AFF; --theme-light: #E3F2FD; } /* Biru */
  .theme-3 { --theme-color: #FFB300; --theme-light: #FFF8E1; } /* Kuning */
  .theme-4 { --theme-color: #69F0AE; --theme-light: #E8F5E9; } /* Hijau */
  .theme-5 { --theme-color: #E040FB; --theme-light: #F3E5F5; } /* Ungu */
  .theme-6 { --theme-color: #FF6E40; --theme-light: #FBE9E7; } /* Oranye */
  .theme-7 { --theme-color: #00E5FF; --theme-light: #E0F7FA; } /* Cyan */
  .theme-8 { --theme-color: #FF4081; --theme-light: #FCE4EC; } /* Pink */
  .theme-9 { --theme-color: #7C4DFF; --theme-light: #EDE7F6; } /* Indigo */
  .theme-0 { --theme-color: #78909C; --theme-light: #ECEFF1; } /* Abu */

  .footer {
    text-align: center;
    color: #fff;
    font-size: clamp(12px, 1.5vw, 16px);
    margin-top: 6px;
    padding-bottom: 4px;
    z-index: 1;
    font-weight: 600;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    background: rgba(0,0,0,0.1);
    border-radius: 20px;
    padding: 6px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
  }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .grid { gap: 8px; }
    .card-face { border-width: 5px; border-radius: 18px; }
  }
  @media (max-width: 600px) {
    body { padding: 4px; }
    .grid { gap: 5px; }
    .card-face { border-width: 4px; border-radius: 14px; padding: 4px; }
    .animal-grid .emoji { font-size: clamp(18px, 4vw, 28px); }
    .sun { width: 50px; height: 50px; }
  }
  @media (max-width: 400px) {
    .grid { gap: 3px; }
    .card-face { border-width: 3px; border-radius: 10px; }
  }

  /* Animasi Memantul saat diketuk */
  .bounce {
    animation: bounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes bounce {
    0% { transform: scale(1); }
    40% { transform: scale(0.9) rotate(-3deg); }
    70% { transform: scale(1.1) rotate(3deg); }
    100% { transform: scale(1) rotate(0); }
  }
</style>
</head>
<body>

<!-- Hiasan Latar Belakang -->
<div class="sun"></div>
<div class="cloud cloud-1"></div>
<div class="cloud cloud-2"></div>

<h1>🌟 Ayo Belajar 🌟</h1>
<h2>Mengenal Angka</h2>

<div class="grid" id="grid"></div>

<div class="footer">
  👆 Ketuk 1x = Suara &nbsp;|&nbsp; 👆 Ketuk 2x = Lihat Hewan
</div>

<script>
const cards = [
  { n: 1, label: 'SATU',    animal: '', name: 'Sapi' },
  { n: 2, label: 'DUA',     animal: '🐱', name: 'Kucing' },
  { n: 3, label: 'TIGA',    animal: '🐶', name: 'Anjing' },
  { n: 4, label: 'EMPAT',   animal: '🐰', name: 'Kelinci' },
  { n: 5, label: 'LIMA',    animal: '🐟', name: 'Ikan' },
  { n: 6, label: 'ENAM',    animal: '', name: 'Burung' },
  { n: 7, label: 'TUJUH',   animal: '🐸', name: 'Katak' },
  { n: 8, label: 'DELAPAN', animal: '', name: 'Kupu-kupu' },
  { n: 9, label: 'SEMBILAN',animal: '🐝', name: 'Lebah' },
  { n: 0, label: 'NOL',     animal: '',   name: 'Tidak ada' },
];

const synth = window.speechSynthesis;
let voices = [];

function loadVoices() {
  voices = synth.getVoices();
  const idVoice = voices.find(v => /id|indonesia/i.test(v.lang))
               || voices.find(v => /ms|malay/i.test(v.lang));
  return idVoice || voices[0];
}

if (synth) {
  loadVoices();
  if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
  const warm = new SpeechSynthesisUtterance('');
  warm.volume = 0;
  synth.speak(warm);
}

function speak(text) {
  if (!synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'id-ID';
  u.rate = 1.0;
  u.pitch = 1.2; /* Pitch lebih tinggi agar suara lebih ceria */
  u.volume = 1;
  const v = loadVoices();
  if (v) u.voice = v;
  synth.speak(u);
}

const grid = document.getElementById('grid');

cards.forEach((c, index) => {
  const container = document.createElement('div');
  container.className = 'card-container';

  const card = document.createElement('div');
  card.className = 'card';

  // Tentukan tema warna berdasarkan index
  const themeClass = `theme-${c.n === 0 ? 0 : (c.n % 9) + 1}`;
  // Untuk variasi warna yang lebih acak dan ceria
  const themes = ['theme-1','theme-2','theme-3','theme-4','theme-5','theme-6','theme-7','theme-8','theme-9','theme-0'];
  const cardTheme = themes[index];

  const front = document.createElement('div');
  front.className = `card-face card-front ${cardTheme}`;
  front.style.borderColor = `var(--theme-color)`;
  front.innerHTML = `
    <div class="number" style="color:var(--theme-color)">${c.n}</div>
    <div class="label">${c.label}</div>
  `;

  const back = document.createElement('div');
  back.className = `card-face card-back ${cardTheme}`;
  back.style.borderColor = `var(--theme-color)`;

  if (c.n === 0) {
    back.innerHTML = `
      <div class="zero-display"></div>
      <div class="animal-name">Nol — Tidak ada</div>
    `;
  } else {
    let emojisHtml = '';
    for (let i = 0; i < c.n; i++) {
      emojisHtml += `<div class="emoji">${c.animal}</div>`;
    }
    back.innerHTML = `
      <div class="animal-grid layout-${c.n}">${emojisHtml}</div>
      <div class="animal-name">${c.n} ${c.name.toLowerCase()}</div>
    `;
  }

  card.appendChild(front);
  card.appendChild(back);
  container.appendChild(card);

  let tapCount = 0;
  let tapTimer = null;

  container.addEventListener('click', () => {
    tapCount++;

    if (tapCount === 1) {
      speak(c.label.toLowerCase());
      // Tambah animasi bounce
      card.classList.add('bounce');
      setTimeout(() => card.classList.remove('bounce'), 500);
      tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
    } else if (tapCount === 2) {
      clearTimeout(tapTimer);
      tapCount = 0;
      if (card.classList.contains('flipped')) {
        card.classList.remove('flipped');
      } else {
        card.classList.add('flipped');
        setTimeout(() => {
          if (c.n === 0) {
            speak('nol, tidak ada');
          } else {
            speak(`${c.label.toLowerCase()}, ${c.name.toLowerCase()}`);
          }
        }, 350);
      }
    }
  });

  grid.appendChild(container);
});

document.body.addEventListener('touchstart', () => {
  if (synth) {
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    synth.speak(u);
  }
}, { once: true });

document.body.addEventListener('click', () => {
  if (synth) {
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    synth.speak(u);
  }
}, { once: true });
</script>

</body>
</html>
