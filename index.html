<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayo Belajar Mengenal Angka</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
    background: linear-gradient(180deg, #c8e6c9 0%, #e8f5e9 50%, #fff9c4 100%);
    min-height: 100vh;
    padding: 20px;
    overflow-x: hidden;
  }

  .leaf {
    position: fixed;
    font-size: 40px;
    opacity: 0.6;
    pointer-events: none;
  }
  .leaf-tl { top: 10px; left: 10px; }
  .leaf-tr { top: 10px; right: 10px; transform: scaleX(-1); }

  h1 {
    text-align: center;
    color: #2e7d32;
    font-size: clamp(32px, 6vw, 56px);
    text-shadow: 2px 2px 0 #fff;
    margin-bottom: 10px;
    line-height: 1.2;
  }
  h2 {
    text-align: center;
    color: #1b5e20;
    font-size: clamp(24px, 5vw, 42px);
    text-shadow: 2px 2px 0 #fff;
    margin-bottom: 30px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 18px;
    max-width: 1000px;
    margin: 0 auto 30px;
  }

  .card-container {
    perspective: 1200px;
    height: 180px;          /* kartu diperbesar */
    cursor: pointer;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    border: 4px solid #fff;
    overflow: hidden;       /* kunci: cegah konten keluar */
    padding: 10px;
  }

  .card-front {
    background: #fff;
  }

  .card-back {
    background: linear-gradient(135deg, #fffde7 0%, #fff9c4 100%);
    transform: rotateY(180deg);
  }

  .number {
    font-size: clamp(60px, 10vw, 96px);  /* angka lebih besar */
    font-weight: bold;
    line-height: 1;
  }

  .label {
    font-size: clamp(14px, 2.2vw, 18px);
    font-weight: bold;
    color: #333;
    margin-top: 10px;
    letter-spacing: 2px;
  }

  /* ===== GRID HEWAN DI BELAKANG KARTU ===== */
  .animal-grid {
    display: grid;
    gap: 2px;
    width: 100%;
    height: 75%;
    align-content: center;
    justify-content: center;
    padding: 4px;
  }

  .animal-grid .emoji {
    font-size: clamp(22px, 3.5vw, 34px);
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .animal-name {
    font-size: clamp(11px, 1.6vw, 14px);
    color: #555;
    margin-top: 4px;
    text-align: center;
    font-weight: bold;
  }

  /* Layout khusus per jumlah */
  .layout-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .layout-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  .layout-3 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr; }
  .layout-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .layout-5 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .layout-6 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .layout-7 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
  .layout-8 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
  .layout-9 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }

  .layout-7 .emoji:nth-child(7),
  .layout-8 .emoji:nth-child(7),
  .layout-9 .emoji:nth-child(7) {
    grid-column: 1 / -1;
    justify-self: center;
  }

  .zero-display {
    font-size: 60px;
    color: #999;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 75%;
  }

  /* Warna angka */
  .c1 .number { color: #e53935; }
  .c2 .number { color: #1e88e5; }
  .c3 .number { color: #fb8c00; }
  .c4 .number { color: #e53935; }
  .c5 .number { color: #1e88e5; }
  .c6 .number { color: #fb8c00; }
  .c7 .number { color: #e53935; }
  .c8 .number { color: #1e88e5; }
  .c9 .number { color: #fb8c00; }
  .c0 .number { color: #fb8c00; }

  .footer {
    text-align: center;
    color: #555;
    font-size: 15px;
    margin-top: 20px;
  }
  .footer .kids { font-size: 60px; margin-top: 10px; }

  @media (max-width: 700px) {
    .grid { grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .card-container { height: 140px; }
    .number { font-size: 50px; }
    .animal-grid .emoji { font-size: 20px; }
  }

  @media (max-width: 420px) {
    .grid { grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .card-container { height: 110px; }
    .number { font-size: 40px; }
    .label { font-size: 10px; }
    .animal-grid .emoji { font-size: 16px; }
  }

  .card-container:active .card:not(.flipped) {
    transform: scale(0.95);
  }

  .pulse {
    animation: pulse 0.4s ease;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>

<div class="leaf leaf-tl"></div>
<div class="leaf leaf-tr">🌿</div>

<h1>Ayo Belajar</h1>
<h2>Mengenal Angka</h2>

<div class="grid" id="grid"></div>

<div class="footer">
  <div>Ketuk 1x = dengar suara • Ketuk 2x = lihat hewan</div>
  <div class="kids">👧 </div>
</div>

<script>
const cards = [
  { n: 1, label: 'SATU',    color: '#e53935', animal: '🐄', name: 'Sapi' },
  { n: 2, label: 'DUA',     color: '#1e88e5', animal: '🐱', name: 'Kucing' },
  { n: 3, label: 'TIGA',    color: '#fb8c00', animal: '🐶', name: 'Anjing' },
  { n: 4, label: 'EMPAT',   color: '#e53935', animal: '', name: 'Kelinci' },
  { n: 5, label: 'LIMA',    color: '#1e88e5', animal: '🐟', name: 'Ikan' },
  { n: 6, label: 'ENAM',    color: '#fb8c00', animal: '🐦', name: 'Burung' },
  { n: 7, label: 'TUJUH',   color: '#e53935', animal: '🐸', name: 'Katak' },
  { n: 8, label: 'DELAPAN', color: '#1e88e5', animal: '', name: 'Kupu-kupu' },
  { n: 9, label: 'SEMBILAN',color: '#fb8c00', animal: '🐝', name: 'Lebah' },
  { n: 0, label: 'NOL',     color: '#fb8c00', animal: '',   name: 'Tidak ada' },
];

const synth = window.speechSynthesis;
let voices = [];

function loadVoices() {
  voices = synth.getVoices();
  const idVoice = voices.find(v => /id|indonesia/i.test(v.lang))
               || voices.find(v => /ms|malay/i.test(v.lang));
  return idVoice || voices[0];
}

if (synth) {
  loadVoices();
  if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
  const warm = new SpeechSynthesisUtterance('');
  warm.volume = 0;
  synth.speak(warm);
}

function speak(text) {
  if (!synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'id-ID';
  u.rate = 1.0;
  u.pitch = 1.1;
  u.volume = 1;
  const v = loadVoices();
  if (v) u.voice = v;
  synth.speak(u);
}

const grid = document.getElementById('grid');

cards.forEach(c => {
  const container = document.createElement('div');
  container.className = 'card-container';

  const card = document.createElement('div');
  card.className = 'card';

  const front = document.createElement('div');
  front.className = 'card-face card-front';
  front.innerHTML = `
    <div class="number" style="color:${c.color}">${c.n}</div>
    <div class="label">${c.label}</div>
  `;

  const back = document.createElement('div');
  back.className = 'card-face card-back';

  if (c.n === 0) {
    back.innerHTML = `
      <div class="zero-display">🚫</div>
      <div class="animal-name">Nol — Tidak ada</div>
    `;
  } else {
    // Buat grid emoji
    let emojisHtml = '';
    for (let i = 0; i < c.n; i++) {
      emojisHtml += `<div class="emoji">${c.animal}</div>`;
    }
    back.innerHTML = `
      <div class="animal-grid layout-${c.n}">${emojisHtml}</div>
      <div class="animal-name">${c.n} ${c.name.toLowerCase()}</div>
    `;
  }

  card.appendChild(front);
  card.appendChild(back);
  container.appendChild(card);

  let tapCount = 0;
  let tapTimer = null;

  container.addEventListener('click', () => {
    tapCount++;

    if (tapCount === 1) {
      speak(c.label.toLowerCase());
      card.classList.add('pulse');
      setTimeout(() => card.classList.remove('pulse'), 400);
      tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
    } else if (tapCount === 2) {
      clearTimeout(tapTimer);
      tapCount = 0;
      if (card.classList.contains('flipped')) {
        card.classList.remove('flipped');
      } else {
        card.classList.add('flipped');
        setTimeout(() => {
          if (c.n === 0) {
            speak('nol, tidak ada');
          } else {
            speak(`${c.label.toLowerCase()}, ${c.name.toLowerCase()}`);
          }
        }, 350);
      }
    }
  });

  grid.appendChild(container);
});

document.body.addEventListener('touchstart', () => {
  if (synth) {
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    synth.speak(u);
  }
}, { once: true });

document.body.addEventListener('click', () => {
  if (synth) {
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    synth.speak(u);
  }
}, { once: true });
</script>

</body>
</html>
