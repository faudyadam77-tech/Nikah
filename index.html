<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayo Belajar Mengenal Angka</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
    background: linear-gradient(180deg, #c8e6c9 0%, #e8f5e9 50%, #fff9c4 100%);
    min-height: 100vh;
    padding: 20px;
    overflow-x: hidden;
  }

  /* Hiasan daun */
  .leaf {
    position: fixed;
    font-size: 40px;
    opacity: 0.6;
    pointer-events: none;
  }
  .leaf-tl { top: 10px; left: 10px; }
  .leaf-tr { top: 10px; right: 10px; transform: scaleX(-1); }

  h1 {
    text-align: center;
    color: #2e7d32;
    font-size: clamp(28px, 5vw, 48px);
    text-shadow: 2px 2px 0 #fff;
    margin-bottom: 10px;
    line-height: 1.2;
  }
  h2 {
    text-align: center;
    color: #1b5e20;
    font-size: clamp(22px, 4vw, 36px);
    text-shadow: 2px 2px 0 #fff;
    margin-bottom: 30px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    max-width: 900px;
    margin: 0 auto 30px;
  }

  .card-container {
    perspective: 1000px;
    height: 140px;
    cursor: pointer;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    border: 4px solid #fff;
  }

  .card-front {
    background: #fff;
  }

  .card-back {
    background: #fff;
    transform: rotateY(180deg);
    padding: 8px;
  }

  .number {
    font-size: clamp(40px, 8vw, 72px);
    font-weight: bold;
    line-height: 1;
  }

  .label {
    font-size: clamp(12px, 2vw, 16px);
    font-weight: bold;
    color: #333;
    margin-top: 8px;
    letter-spacing: 1px;
  }

  .animals {
    font-size: clamp(20px, 3.5vw, 32px);
    text-align: center;
    line-height: 1.2;
    word-break: break-all;
  }

  .animal-name {
    font-size: clamp(10px, 1.5vw, 13px);
    color: #555;
    margin-top: 4px;
    text-align: center;
  }

  /* Warna angka */
  .c1 .number { color: #e53935; }
  .c2 .number { color: #1e88e5; }
  .c3 .number { color: #fb8c00; }
  .c4 .number { color: #e53935; }
  .c5 .number { color: #1e88e5; }
  .c6 .number { color: #fb8c00; }
  .c7 .number { color: #e53935; }
  .c8 .number { color: #1e88e5; }
  .c9 .number { color: #fb8c00; }
  .c0 .number { color: #fb8c00; }

  .footer {
    text-align: center;
    color: #555;
    font-size: 14px;
    margin-top: 20px;
  }

  .footer .kids {
    font-size: 60px;
    margin-top: 10px;
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .card-container { height: 110px; }
  }

  /* Animasi tap */
  .card-container:active .card:not(.flipped) {
    transform: scale(0.95);
  }

  .pulse {
    animation: pulse 0.4s ease;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>

<div class="leaf leaf-tl">🌿</div>
<div class="leaf leaf-tr">🌿</div>

<h1>Ayo Belajar</h1>
<h2>Mengenal Angka</h2>

<div class="grid" id="grid"></div>

<div class="footer">
  <div>Ketuk 1x = dengar suara • Ketuk 2x = lihat hewan</div>
  <div class="kids">👧 </div>
</div>

<script>
// ============ DATA KARTU ============
const cards = [
  { n: 1, label: 'SATU',   color: '#e53935', animal: '🐄', name: 'Sapi' },
  { n: 2, label: 'DUA',    color: '#1e88e5', animal: '🐱', name: 'Kucing' },
  { n: 3, label: 'TIGA',   color: '#fb8c00', animal: '🐶', name: 'Anjing' },
  { n: 4, label: 'EMPAT',  color: '#e53935', animal: '🐰', name: 'Kelinci' },
  { n: 5, label: 'LIMA',   color: '#1e88e5', animal: '🐟', name: 'Ikan' },
  { n: 6, label: 'ENAM',   color: '#fb8c00', animal: '🐦', name: 'Burung' },
  { n: 7, label: 'TUJUH',  color: '#e53935', animal: '🐸', name: 'Katak' },
  { n: 8, label: 'DELAPAN',color: '#1e88e5', animal: '🦋', name: 'Kupu-kupu' },
  { n: 9, label: 'SEMBILAN',color:'#fb8c00', animal: '🐝', name: 'Lebah' },
  { n: 0, label: 'NOL',    color: '#fb8c00', animal: '',   name: 'Tidak ada' },
];

// ============ PRE-LOAD SUARA (agar cepat keluar) ============
const synth = window.speechSynthesis;
let voices = [];

function loadVoices() {
  voices = synth.getVoices();
  // Cari suara Indonesia, fallback ke default
  const idVoice = voices.find(v => /id|indonesia/i.test(v.lang));
  return idVoice || voices[0];
}

// Panggil di awal agar browser siap
if (synth) {
  loadVoices();
  if (synth.onvoiceschanged !== undefined) {
    synth.onvoiceschanged = loadVoices;
  }
  // "Warm-up" dengan utterance kosong agar engine siap
  const warm = new SpeechSynthesisUtterance('');
  warm.volume = 0;
  synth.speak(warm);
}

function speak(text) {
  if (!synth) return;
  synth.cancel(); // Hentikan suara sebelumnya agar langsung keluar
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'id-ID';
  u.rate = 1.0;
  u.pitch = 1.1;
  u.volume = 1;
  const v = loadVoices();
  if (v) u.voice = v;
  synth.speak(u);
}

// ============ BANGUN KARTU ============
const grid = document.getElementById('grid');

cards.forEach(c => {
  const container = document.createElement('div');
  container.className = 'card-container';

  const card = document.createElement('div');
  card.className = 'card';

  // Depan: angka
  const front = document.createElement('div');
  front.className = 'card-face card-front';
  front.innerHTML = `
    <div class="number" style="color:${c.color}">${c.n}</div>
    <div class="label">${c.label}</div>
  `;

  // Belakang: hewan
  const back = document.createElement('div');
  back.className = 'card-face card-back';
  let animalsHtml = '';
  if (c.n === 0) {
    animalsHtml = '<div style="font-size:40px;color:#999;">∅</div>';
  } else {
    animalsHtml = `<div class="animals">${(c.animal + ' ').repeat(c.n).trim()}</div>`;
  }
  back.innerHTML = `
    ${animalsHtml}
    <div class="animal-name">${c.n} ${c.name.toLowerCase()}</div>
  `;

  card.appendChild(front);
  card.appendChild(back);
  container.appendChild(card);

  // ============ LOGIKA KETUK ============
  let tapCount = 0;
  let tapTimer = null;

  container.addEventListener('click', () => {
    tapCount++;

    if (tapCount === 1) {
      // Ketuk pertama: suara + animasi pulse
      speak(c.label.toLowerCase());
      card.classList.add('pulse');
      setTimeout(() => card.classList.remove('pulse'), 400);

      // Reset counter setelah 1.5 detik jika tidak ada ketukan kedua
      tapTimer = setTimeout(() => { tapCount = 0; }, 1500);

    } else if (tapCount === 2) {
      // Ketuk kedua: balik kartu + suara hewan
      clearTimeout(tapTimer);
      tapCount = 0;

      if (card.classList.contains('flipped')) {
        card.classList.remove('flipped');
      } else {
        card.classList.add('flipped');
        // Sebutkan jumlah hewan setelah kartu berbalik
        setTimeout(() => {
          if (c.n === 0) {
            speak('nol, tidak ada');
          } else {
            speak(`${c.label.toLowerCase()}, ${c.name.toLowerCase()}`);
          }
        }, 300);
      }
    }
  });

  grid.appendChild(container);
});

// Unlock audio di mobile (butuh user gesture pertama)
document.body.addEventListener('touchstart', () => {
  if (synth) {
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    synth.speak(u);
  }
}, { once: true });

document.body.addEventListener('click', () => {
  if (synth) {
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    synth.speak(u);
  }
}, { once: true });
</script>

</body>
</html>
